<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>आओ सीखें इंग्लिश</title>
<style>
:root{
  --bg:#FBF7EE; --panel:#FFFFFF; --ink:#1F2A22; --sub:#6B7268;
  --brand:#1B8A5A; --brand-dark:#136B45; --accent:#F2994A; --accent2:#E85D5D;
  --line:#E7E1D2; --locked:#D9D4C6; --gold:#E0A526;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14201A; --panel:#1C2A22; --ink:#EFEDE3; --sub:#9BA79E;
    --brand:#39B37B; --brand-dark:#2C8F62; --accent:#F2A75E; --accent2:#EB7373;
    --line:#2A3A30; --locked:#28352C;
  }
}
:root[data-theme="dark"]{
  --bg:#14201A; --panel:#1C2A22; --ink:#EFEDE3; --sub:#9BA79E;
  --brand:#39B37B; --brand-dark:#2C8F62; --accent:#F2A75E; --accent2:#EB7373;
  --line:#2A3A30; --locked:#28352C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:border-box;}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;
  overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100%;position:relative;}

/* ---------- HOME ---------- */
.topbar{
  position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:var(--bg);display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line);z-index:5;
}
.brandmark{font-weight:800;font-size:17px;color:var(--brand-dark);letter-spacing:.2px;}
.stats{display:flex;gap:10px;font-weight:700;font-size:14px;}
.chip{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;}

.unit{margin:22px 0;}
.unit-head{background:var(--brand);color:#fff;margin:0 16px 18px;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.unit-head h2{margin:0;font-size:15px;}
.unit-head span{font-size:12px;opacity:.85;}

.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:4px 0 30px;}
.node{
  width:60px;height:60px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#fff;background:var(--locked);position:relative;cursor:default;
  box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.node.done{background:var(--gold);box-shadow:0 4px 0 #a8781a;cursor:pointer;}
.node.next{background:var(--brand);box-shadow:0 4px 0 var(--brand-dark);cursor:pointer;}
.node.locked{color:var(--sub);}
.node .lv{position:absolute;bottom:-18px;font-size:10px;color:var(--sub);font-weight:600;}
.path .node:nth-child(4n+2){transform:translateX(-34px);}
.path .node:nth-child(4n){transform:translateX(34px);}

/* ---------- LESSON ---------- */
#lesson{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20;}
#lesson.show{display:flex;}
.lhead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;}
.closeBtn{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1;padding:4px;}
.bar{flex:1;height:12px;background:var(--line);border-radius:8px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--brand);width:0%;transition:width .3s;}
.hearts{display:flex;gap:3px;font-size:15px;color:var(--accent2);white-space:nowrap;}

.qwrap{flex:1;display:flex;flex-direction:column;padding:18px 20px;overflow-y:auto;}
.qtag{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.qtext{font-size:26px;font-weight:700;line-height:1.35;margin-bottom:26px;}
.opts{display:flex;flex-direction:column;gap:12px;}
.opt{
  text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--panel);
  color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;
}
.opt.correct{border-color:var(--brand);background:color-mix(in srgb, var(--brand) 15%, var(--panel));animation:pop .35s ease;}
.opt.wrong{border-color:var(--accent2);background:color-mix(in srgb, var(--accent2) 15%, var(--panel));}
.opt:disabled{cursor:default;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.035);}100%{transform:scale(1);}}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.speakBtn{background:var(--panel);border:2px solid var(--line);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.speakBtn:active{transform:scale(.92);}
.node.next{animation:glow 1.8s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--brand-dark);}50%{box-shadow:0 4px 0 var(--brand-dark),0 0 0 6px color-mix(in srgb, var(--brand) 25%, transparent);}}

.footer{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);}
.fb{display:none;padding:10px 4px 14px;font-weight:700;font-size:15px;}
.fb.ok{color:var(--brand);}
.fb.bad{color:var(--accent2);}
.contBtn{
  width:100%;padding:15px;border:none;border-radius:14px;background:var(--locked);color:var(--sub);
  font-weight:800;font-size:16px;cursor:not-allowed;
}
.contBtn.on{background:var(--brand);color:#fff;cursor:pointer;}

/* ---------- OVERLAYS ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:20px;}
.overlay.show{display:flex;}
.card{background:var(--panel);border-radius:20px;padding:30px 26px;max-width:340px;text-align:center;}
.card h3{margin:0 0 8px;font-size:22px;}
.card p{color:var(--sub);margin:0 0 20px;font-size:14px;}
.card .big{font-size:44px;margin-bottom:6px;}
.card button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;cursor:pointer;}
</style>
</head>

/* ================= LEVEL GENERATION ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const TOTAL_LEVELS=100;

  const catIdx=(lv-1)%CATS.length;
  const tier=Math.floor((lv-1)/CATS.length);
  return {cat:CATS[catIdx],catIdx,tier};
}

  const qs=[];
  const wantSentence = tier>=2;
  const nSentence = wantSentence ? (tier>=4?3:2) : 0;
  const nWord = 10-nSentence;

  // gather a wider pool for distractors: current cat + up to 2 previous cats
  let pool=cat.w.slice();
  for(let k=1;k<=2;k++){
    const prevIdx=(catIdx-k+CATS.length)%CATS.length;
    if(prevIdx!==catIdx) pool=pool.concat(CATS[prevIdx].w);
  }
  const wordChoices = shuffle(cat.w.length? cat.w : pool, rng).slice(0, Math.max(nWord,1));
  while(wordChoices.length<nWord){ wordChoices.push(pool[Math.floor(rng()*pool.length)]); }

  wordChoices.slice(0,nWord).forEach(pair=>{
    const toEnglish = rng()<0.5;
    const [en,hi]=pair;
    const correct = toEnglish?en:hi;
    const distractPool = pool.filter(p=>p[0]!==en);
    const distractors = shuffle(distractPool,rng).slice(0,3).map(p=>toEnglish?p[0]:p[1]);
    const opts = shuffle([correct,...distractors].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4),rng);
    while(opts.length<4){ const extra=pool[Math.floor(rng()*pool.length)]; const val=toEnglish?extra[0]:extra[1]; if(!opts.includes(val)) opts.push(val); }
    qs.push({
      tag: toEnglish? "अंग्रेज़ी में बताओ" : "हिंदी में बताओ",
      text: toEnglish? hi : en,
      options: opts,
      answer: correct
    });
  });

  if(wantSentence){
    const picks=shuffle(SENT,rng).slice(0,nSentence);
    picks.forEach(s=>{
      const correctSent=s.parts.join(" ").replace(/ \./g,".").replace(/ \?/g,"?");
      const wrong1=shuffle(s.parts,rng).join(" ");
      const otherS=SENT[Math.floor(rng()*SENT.length)];
      const wrong2=otherS.parts.slice(0,s.parts.length).join(" ")||otherS.parts.join(" ");
      const wrong3=shuffle(s.parts,rng).join(" ");
      let opts=[correctSent,wrong1,wrong2,wrong3].filter((v,i,a)=>a.indexOf(v)===i);
      while(opts.length<4) opts.push(shuffle(s.parts,rng).join(" "));
      qs.push({
        tag:"सही वाक्य चुनो",
        text:s.hi,
        options:shuffle(opts.slice(0,4),rng),
        answer:correctSent
      });
    });
  }
  return shuffle(qs,rng).slice(0,10);
}

/* ================= AD NETWORK CONFIG =================
   ये सिर्फ़ जगह है — असली ऐड यहाँ नहीं चलेगा (वेब आर्टिफ़ैक्ट में
   नेटिव SDK चल ही नहीं सकता)। जब इसे APK में बदलोगे, वहाँ का
   native Android कोड इन्हीं IDs को इस्तेमाल करेगा। जितने भी नेटवर्क
   भेजो, यहीं नीचे नई एंट्री जोड़ता जाऊँगा। */
const AD_CONFIG = {
  unityAds: {
    gameId: "800379873",
    banner: "BP_Banner_Android",
    interstitial: "BP_Interstitial_Android",
    rewarded: "BP_Rewarded_Android"
  },
  startIo: {
    appId: "208690222"
  },
  adMob: {
    appId: "ca-app-pub-1493112125477027~9352723284",
    banner: "ca-app-pub-1493112125477027/2647803420",
    interstitial: "ca-app-pub-1493112125477027/3904955481",
    rewarded: "ca-app-pub-1493112125477027/5172885252",
    rewardedInterstitial: "ca-app-pub-1493112125477027/9085129974",
    appOpen: "ca-app-pub-1493112125477027/6890211479",
    nativeAdvanced: "ca-app-pub-1493112125477027/8920558573"
  }
  // अगला नेटवर्क भेजोगे तो यहाँ जुड़ेगा
};
/* नेटिव ऐप में यह function असली ब्रिज (Android WebView/Capacitor) से
   बदला जाएगा। ब्राउज़र में यह चुपचाप कुछ नहीं करता — टूटता नहीं। */
function showAd(kind){
  try{
    if(window.NativeAdBridge && typeof window.NativeAdBridge.show==="function"){
      window.NativeAdBridge.show(kind); // kind: "banner" | "interstitial" | "rewarded"
    }
  }catch(e){}
}

/* ================= STATE ================= */
const SKEY="aao_seekho_state_v1";
function loadState(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {unlocked:1,completed:{},xp:0,streak:0,lastDate:null,adLevelsSinceLast:0,adNextGap:null};
}
function saveState(){ try{ localStorage.setItem(SKEY,JSON.stringify(state)); }catch(e){} }
let state=loadState();

function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const t=todayStr();
  if(state.lastDate===t) return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak = (state.lastDate===y)? state.streak+1 : 1;
  state.lastDate=t;
  saveState();
}

/* ================= HOME RENDER ================= */
function renderHome(){
  document.getElementById("streakN").textContent=state.streak;
  document.getElementById("xpN").textContent=state.xp;
  const root=document.getElementById("units");
  root.innerHTML="";
  const perUnit=CATS.length; // one "unit" = one full pass of categories (13 levels)
  const numUnits=Math.ceil(TOTAL_LEVELS/perUnit);
  for(let u=0;u<numUnits;u++){
    const startLv=u*perUnit+1;
    const endLv=Math.min(TOTAL_LEVELS,(u+1)*perUnit);
    const unitDiv=document.createElement("div");
    unitDiv.className="unit";
    const head=document.createElement("div");
    head.className="unit-head";
    head.innerHTML=`<h2>राउंड ${u+1}</h2><span>लेवल ${startLv}–${endLv}</span>`;
    unitDiv.appendChild(head);
    const path=document.createElement("div");
    path.className="path";
    for(let lv=startLv; lv<=endLv; lv++){
      const btn=document.createElement("button");
      const done=!!state.completed[lv];
      const isNext=lv===state.unlocked;
      const locked=lv>state.unlocked;
      btn.className="node "+(done?"done":isNext?"next":"locked");
      btn.innerHTML= done? "★" : (lv+`<span class="lv"></span>`);
      if(!locked) btn.onclick=()=>openLesson(lv);
      path.appendChild(btn);
    }
    unitDiv.appendChild(path);
    root.appendChild(unitDiv);
  }
}

/* ================= LESSON FLOW ================= */
let cur={lv:null,qs:[],idx:0,hearts:5,answered:false};

/* ऐड दिखाने का नियम: पहले 3 राउंड (लेवल 1-30) पूरी तरह ऐड-फ्री।
   लेवल 31 खुलते ही एक ऐड, फिर उसके बाद हर तीसरे लेवल पूरा होने पर एक ऐड। */
function shouldShowAdOnStart(lv){ return lv===11; }
function pickAdGap(){ return Math.random()<0.5 ? 3 : 4; } // कभी 3 लेवल बाद, कभी 4 लेवल बाद
function maybeShowFinishAd(lv){
  if(lv<11) return;
  if(state.adNextGap==null) state.adNextGap=pickAdGap();
  state.adLevelsSinceLast=(state.adLevelsSinceLast||0)+1;
  if(state.adLevelsSinceLast>=state.adNextGap){
    showAd("interstitial");
    state.adLevelsSinceLast=0;
    state.adNextGap=pickAdGap();
  }
  saveState();
}

function openLesson(lv){
  if(shouldShowAdOnStart(lv)) showAd("interstitial");
  cur={lv, qs:generateLevel(lv), idx:0, hearts:5, answered:false};
  document.getElementById("lesson").classList.add("show");
  renderQ();
}
function closeLesson(){ document.getElementById("lesson").classList.remove("show"); renderHome(); }
document.getElementById("closeLesson").onclick=closeLesson;

function renderHearts(){
  document.getElementById("heartsBar").textContent="♥".repeat(cur.hearts)+"♡".repeat(5-cur.hearts);
}
function renderQ(){
  const q=cur.qs[cur.idx];
  document.getElementById("progBar").querySelector? null:null;
  document.getElementById("progBar").style.width=(cur.idx/cur.qs.length*100)+"%";
  renderHearts();
  document.getElementById("qtag").textContent=q.tag;
  document.getElementById("qtext").textContent=q.text;
  const englishText = (q.tag==="हिंदी में बताओ") ? q.text : q.answer;
  document.getElementById("speakBtn").onclick=()=>{
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(englishText);
      u.lang="en-US"; u.rate=0.9;
      window.speechSynthesis.speak(u);
    }catch(e){}
  };
  const opts=document.getElementById("opts");
  opts.innerHTML="";
  cur.answered=false;
  document.getElementById("fb").style.display="none";
  const contBtn=document.getElementById("contBtn");
  contBtn.className="contBtn";
  contBtn.textContent="जारी रखें";
  q.options.forEach(optVal=>{
    const b=document.createElement("button");
    b.className="opt";
    b.textContent=optVal;
    b.onclick=()=>selectOpt(b,optVal,q.answer);
    opts.appendChild(b);
  });
}
function selectOpt(btn,val,answer){
  if(cur.answered) return;
  cur.answered=true;
  const correct = val===answer;
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.disabled=true;
    if(b.textContent===answer) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
  });
  const fb=document.getElementById("fb");
  fb.style.display="block";
  if(correct){
    fb.className="fb ok"; fb.textContent="बिल्कुल सही! 🎉";
    state.xp+=2; saveState();
  }else{
    fb.className="fb bad"; fb.textContent="सही जवाब: "+answer;
    cur.hearts--; renderHearts();
  }
  const contBtn=document.getElementById("contBtn");
  contBtn.classList.add("on");
  contBtn.onclick=()=>{
    if(cur.hearts<=0){ document.getElementById("failOverlay").classList.add("show"); return; }
    cur.idx++;
    if(cur.idx>=cur.qs.length){ finishLevel(); return; }
    renderQ();
  };
}
function finishLevel(){
  document.getElementById("progBar").style.width="100%";
  const isNew = !state.completed[cur.lv];
  state.completed[cur.lv]=true;
  if(cur.lv===state.unlocked && state.unlocked<TOTAL_LEVELS) state.unlocked=cur.lv+1;
  const bonus = isNew? 10:5;
  state.xp+=bonus;
  bumpStreak();
  saveState();
  maybeShowFinishAd(cur.lv); // लेवल 31 के बाद, कभी 3 तो कभी 4 लेवल के फ़ासले पर ऐड
  document.getElementById("winSub").textContent = `+${bonus} XP मिले। ${cur.lv<TOTAL_LEVELS?"अगला लेवल खुल गया।":"तुमने सारे लेवल पूरे कर लिए! शाबाश!"}`;
  document.getElementById("winOverlay").classList.add("show");
}
document.getElementById("winBtn").onclick=()=>{
  document.getElementById("winOverlay").classList.remove("show");
  closeLesson();
};
document.getElementById("retryBtn").onclick=()=>{
  document.getElementById("failOverlay").classList.remove("show");
  cur={lv:cur.lv, qs:generateLevel(cur.lv), idx:0, hearts:5, answered:false};
  renderQ();
};
document.getElementById("watchAdBtn").onclick=(e)=>{
  const btn=e.target;
  btn.disabled=true; btn.textContent="ऐड लोड हो रहा है...";
  showAd("rewarded");
  /* नोट: यह सरल वर्ज़न है — असली ऐप में ऐड पूरा देखने के बाद ही इनाम मिलना चाहिए,
     अभी थोड़ी देर बाद अपने-आप दिल भर देता है */
  setTimeout(()=>{
    cur.hearts=5; renderHearts();
    document.getElementById("failOverlay").classList.remove("show");
    btn.disabled=false; btn.textContent="🎬 ऐड देखकर दिल भरो";
  }, 2500);
};

/* रोज़ शाम 7 बजे एक दोस्ताना याद दिलाना — सिर्फ़ असली ऐप में काम करेगा, वेब में चुपचाप कुछ नहीं होगा */
function scheduleDailyReminder(){
  try{
    const C = window.Capacitor;
    if(!C || !C.Plugins || !C.Plugins.LocalNotifications) return;
    const { LocalNotifications } = C.Plugins;
    LocalNotifications.requestPermissions().then(()=>{
      LocalNotifications.schedule({ notifications: [
        {
          id: 1,
          title: "आओ सीखें इंग्लिश 🦉",
          body: "सुबह की 5 मिनट — आज का लेवल शुरू करें!",
          schedule: { on: { hour: 10, minute: 0 }, repeats: true }
        },
        {
          id: 2,
          title: "आओ सीखें इंग्लिश 🦉",
          body: "आज का लेवल पूरा नहीं किया — 5 मिनट निकालो और English सीखो!",
          schedule: { on: { hour: 19, minute: 0 }, repeats: true }
        }
      ]});
    }).catch(()=>{});
  }catch(e){}
}
scheduleDailyReminder();

renderHome();
</script>
